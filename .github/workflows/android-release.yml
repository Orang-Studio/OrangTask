name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      apk_name: ${{ steps.prepare.outputs.apk_name }}
    env:
      # An APK signed by anything else cannot update an existing install.
      SIGNER_SHA256: E3:B8:3E:CC:C1:D7:B4:9D:92:E4:60:54:D9:A4:83:BB:09:56:D6:68:02:8A:F9:F3:57:A5:AB:03:26:6D:80:39

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks

      - name: Build release APK
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION_ARGS=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::'$VERSION' is not MAJOR.MINOR.PATCH"
              exit 1
            fi
            IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
            VERSION_ARGS+=("-PversionName=$VERSION")
            VERSION_ARGS+=("-PversionCode=$((MAJOR * 10000 + MINOR * 100 + PATCH))")
          fi

          ./gradlew --no-daemon :app:assembleRelease \
            "${VERSION_ARGS[@]}" \
            -Pandroid.injected.signing.store.file="$(pwd)/app/release.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --print-certs "$APK"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep -oiE 'SHA-256 digest: [0-9a-f]+' | head -1 | awk '{print $NF}')
          EXPECTED=$(echo "$SIGNER_SHA256" | tr -d ':' | tr 'A-Z' 'a-z')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK signed by $ACTUAL, expected $EXPECTED"
            exit 1
          fi

      - name: Prepare APK asset
        id: prepare
        run: |
          APK_NAME="OrangTask-${GITHUB_REF_NAME#v}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          MAPPING=android/app/build/outputs/mapping/release/mapping.txt
          if [ -f "$MAPPING" ]; then
            cp "$MAPPING" "OrangTask-${GITHUB_REF_NAME#v}-mapping.txt"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.apk_name }}
          path: |
            ${{ steps.prepare.outputs.apk_name }}
            OrangTask-*-mapping.txt
          retention-days: 30

      - name: Wipe signing material
        if: always()
        run: rm -f android/app/release.jks

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.apk
            artifacts/*-mapping.txt
          name: OrangTask ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
