name: Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.2.3'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Fingerprint of ~/.keystores/orangtask-release.jks. An APK signed by anything
      # else cannot update an existing install, so fail the build instead of shipping it.
      SIGNER_SHA256: E3:B8:3E:CC:C1:D7:B4:9D:92:E4:60:54:D9:A4:83:BB:09:56:D6:68:02:8A:F9:F3:57:A5:AB:03:26:6D:80:39

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          # Monotonic and derivable from the version; minor/patch are capped at 99.
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; refusing to publish an unsigned release"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          cat > android/keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed release APK
        working-directory: android
        run: |
          ./gradlew --no-daemon :app:assembleRelease \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }}

      - name: Verify signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --print-certs "$APK"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep -oiE 'SHA-256 digest: [0-9a-f]+' | head -1 | awk '{print $NF}')
          EXPECTED=$(echo "$SIGNER_SHA256" | tr -d ':' | tr 'A-Z' 'a-z')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK signed by $ACTUAL, expected $EXPECTED"
            exit 1
          fi
          mv "$APK" "orangtask-${{ steps.version.outputs.name }}.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.name }}"
          git tag "$TAG" 2>/dev/null || true
          git push origin "$TAG" 2>/dev/null || true
          gh release create "$TAG" \
            --title "OrangTask $TAG" \
            --generate-notes \
            "orangtask-${{ steps.version.outputs.name }}.apk"

      - name: Wipe signing material
        if: always()
        run: rm -f android/release.jks android/keystore.properties
